<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Exercício 9</title>

    <style>
        fieldset {
            width: 130px;
        }
    </style>
</head>

<body>

    <form>
        <fieldset>
            <legend>Dados</legend>

            <div>
                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome" placeholder="Seu nome">
            </div>

            <div>
                <label for="comentarios">Comentários:</label><br>
                <textarea id="comentarios" name="comentarios" rows="4" cols="20" placeholder="Seus comentários"></textarea>
            </div>

        </fieldset>

        <button type="submit">Enviar</button>
    </form>

</body>

</html>
