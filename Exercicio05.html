<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Exercício 5</title>
</head>

<body>

    <form>

        <label>Dia da semana:</label>

        <input type="radio" id="segunda" name="dia" value="segunda" checked>
        <label for="segunda">Segunda-feira</label>

        <input type="radio" id="terca" name="dia" value="terca">
        <label for="terca">Terça-feira</label>

        <input type="radio" id="quarta" name="dia" value="quarta">
        <label for="quarta">Quarta-feira</label>

        <input type="radio" id="quinta" name="dia" value="quinta">
        <label for="quinta">Quinta-feira</label>

        <input type="radio" id="sexta" name="dia" value="sexta">
        <label for="sexta">Sexta-feira</label>

        <input type="radio" id="sabado" name="dia" value="sabado">
        <label for="sabado">Sábado</label>

        <input type="radio" id="domingo" name="dia" value="domingo">
        <label for="domingo">Domingo</label>

        <br>

        <button type="submit">Enviar</button>

    </form>

</body>

</html>
